name: Build

on:
  release:
    types: [created]

jobs:
  generate:
    name: Create release-artifacts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build first artifact
        run: cargo build --release

      - name: Build second artifact
        run: cross --release --target x86_64-pc-windows-gnu

      - run: ls -R

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlackCube-rs Artifact
          path: |
            "./target/release/blackcube-rs" 
            "./target/x86_64-pc-windows-gnu/release/blackcube-rs.exe"
